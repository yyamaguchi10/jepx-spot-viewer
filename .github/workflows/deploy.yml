name: Deploy to Sakura VPS

on:
  workflow_dispatch:
  push:
    branches:
      - testappjepx

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "
              set -e

              cd /home/ubuntu/jepx-spot-viewer &&

              git pull origin testappjepx &&

              .venv/bin/python -m pip install -r requirements.txt &&

              sudo -n systemctl restart jepx.service &&

              sudo -n systemctl is-active --quiet jepx.service
              "