name: Deploy to Sakura VPS

on:
  push:
    branches:
      - testappjepx
  workflow_dispatch:

concurrency:
  group: jepx-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update application on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" << 'EOF'
            set -euo pipefail

            cd /home/ubuntu/jepx-spot-viewer

            git fetch origin testappjepx
            git checkout testappjepx
            git pull --ff-only origin testappjepx

            .venv/bin/pip install -r requirements.txt

            sudo /usr/bin/systemctl restart jepx.service
            sudo /usr/bin/systemctl is-active --quiet jepx.service

            echo "Deployment completed successfully."
          EOF