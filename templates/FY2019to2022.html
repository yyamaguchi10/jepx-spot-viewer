<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>jepx_spot</title>
        <link rel="stylesheet" href="{{url_for('static',filename = 'style.css')}}">
    </head>
    <body>
      <div class="header">
        <div class="header-logo">JEPX Price!!</div>
        <div class="header-list">
          <p>・最新のスポット市場価格を表示します<br>（数値表示は北陸エリア）</p>
        </div>
      </div>
      <div class="datelink">
        <div class="link">
          <a href = "{{url_for('index')}}"> 最新&nbsp;{{latest_date}}&emsp;</a>
          <a href = "{{url_for('dayago1')}}"> 前日&nbsp;{{day_ago1}}&emsp;</a>
          <a href = "{{url_for('dayago2')}}"> 前々日&nbsp;{{day_ago2}}&emsp;</a>
          <a href = "{{url_for('lastweek')}}"> &nbsp;過去1週間&emsp;</a>
          <a href = "{{url_for('lastmonth')}}"> &nbsp;過去30日間&emsp;</a>
          <a href = "{{url_for('FY2019to2022')}}"> &nbsp;過年度比較&emsp;</a>
          <a href = "{{url_for('QR')}}"> &nbsp;QRコード表示&emsp;</a>
        </div>
      </div>

      <div class="image1">
        <img src="data:image/png;base64,{{ img5 }}">
      </div>
      <div class="table2019_2022">
        {{ maxminmeandf|safe }}
        <p>（参考：年度別グラフ）<p>
      </div>
      <div class="image1">
        <img src="data:image/png;base64,{{ img22 }}">
        <img src="data:image/png;base64,{{ img21 }}">
        <img src="data:image/png;base64,{{ img20 }}">
        <img src="data:image/png;base64,{{ img19 }}">
      </div>
    </body>
</html>
